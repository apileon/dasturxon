  const hasDist = districtsOf(r.city_id).length > 0;
  body.innerHTML = `<form id="inf" novalidate>
  <div class="panel"><h2>${esc(T('sec_basic'))}</h2><div class="stack">
    <div class="grid2">
      <label class="field"><span>${esc(T('r_name'))}</span><input class="input" id="f_name" maxlength="80" required value="${esc(r.name)}"></label>
      <label class="field"><span>${esc(T('page_link'))}</span><input class="input" id="f_slug" maxlength="70" value="${esc(r.slug)}" pattern="[a-z0-9-]+"><span class="hint">${esc(siteBase())}#/r/<b id="slugprev">${esc(r.slug)}</b> · ${esc(T('slug_hint'))}</span></label>
    </div>
    ${langFields('f_tag', T('tagline'), r, 'tagline', { max: 140 })}
    ${langFields('f_desc', T('description'), r, 'description', { textarea: true, max: 2000, rows: 4 })}
    <div class="field"><span>${esc(T('cuisine'))}</span><div class="chips" id="f_cuis">${S.cuisines.map((c) => `<button type="button" class="chip ${(r.cuisines || []).includes(c.slug) ? 'on' : ''}" data-v="${c.slug}" aria-pressed="${(r.cuisines || []).includes(c.slug)}">${esc(nameOf(c))}</button>`).join('')}</div></div>
    <div class="field"><span>${esc(T('features'))}</span><div class="chips" id="f_feat">${FEATURES.map((k) => `<button type="button" class="chip ${(r.features || []).includes(k) ? 'on' : ''}" data-v="${k}" aria-pressed="${(r.features || []).includes(k)}">${esc(T('feat_' + k))}</button>`).join('')}</div></div>
  </div></div>

  <div class="panel"><h2>${esc(T('sec_images'))}</h2><div class="grid2">
    <div class="field"><span>${esc(T('logo'))}</span><div class="upl"><div class="prev" id="lgprev">${r.logo_url ? `<img src="${esc(r.logo_url)}" alt="">` : tileHTML(r.name)}</div>
      <div class="stack" style="gap:6px"><label class="btn sm">${svg('upload')}${esc(T('upload'))}<input type="file" id="f_logo" accept="image/*" hidden></label>${r.logo_url ? `<button type="button" class="btn sm ghost danger" data-rm="logo_url">${esc(T('remove'))}</button>` : ''}<span class="hint">${esc(T('logo_hint'))}</span></div></div></div>
    <div class="field"><span>${esc(T('cover'))}</span><div class="upl"><div class="prev wide" id="cvprev">${r.cover_url ? `<img src="${esc(r.cover_url)}" alt="">` : '<div class="tile" style="width:100%;height:100%"></div>'}</div>
      <div class="stack" style="gap:6px"><label class="btn sm">${svg('upload')}${esc(T('upload'))}<input type="file" id="f_cover" accept="image/*" hidden></label>${r.cover_url ? `<button type="button" class="btn sm ghost danger" data-rm="cover_url">${esc(T('remove'))}</button>` : ''}<span class="hint">${esc(T('cover_hint'))}</span></div></div></div>
  </div></div>

  <div class="panel"><h2>${esc(T('sec_location'))}</h2><div class="stack">
    <div class="grid2">
      <label class="field" ${multiCity() ? '' : 'hidden'}><span>${esc(T('city'))}</span><select class="input" id="f_city">${S.cities.map((c) => `<option value="${c.id}" ${c.id === r.city_id ? 'selected' : ''}>${esc(nameOf(c))}</option>`).join('')}</select></label>
      <label class="field" id="distwrap" ${hasDist ? '' : 'hidden'}><span>${esc(T('district_or_place'))}</span><select class="input" id="f_district"><option value="">—</option>${districtOptions(r.city_id, r.district_id)}</select></label>
    </div>
    <div class="grid2">
      <label class="field"><span>${esc(T('address'))}</span><input class="input" id="f_address" maxlength="200" value="${esc(r.address || '')}" placeholder="${esc(T('address_ph'))}"></label>
      <label class="field"><span>${esc(T('landmark'))}</span><input class="input" id="f_landmark" maxlength="200" value="${esc(r.landmark || '')}" placeholder="${esc(T('landmark_ph'))}"></label>
    </div>
    <div class="field"><div class="row"><span class="small" style="font-weight:500;color:var(--muted)">${esc(T('map_pin'))}</span><span class="spacer"></span>
      <button type="button" class="btn sm" id="pinme">${svg('locate')}${esc(T('use_my_location'))}</button><button type="button" class="btn sm ghost" id="pinclear">${esc(T('remove'))}</button></div>
      <div class="pickmap" id="pickmap"></div><span class="hint" id="pinhint">${r.lat != null ? `${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}` : esc(T('map_pin_hint'))}</span></div>
  </div></div>

  <div class="panel"><h2>${esc(T('sec_contacts'))}</h2><div class="grid2">
    <label class="field"><span>${esc(T('phone'))}</span><input class="input" id="f_phone" type="tel" maxlength="32" value="${esc(r.phone || '')}" placeholder="+998 66 123 45 67"></label>
    <label class="field"><span>${esc(T('phone2'))}</span><input class="input" id="f_phone2" type="tel" maxlength="32" value="${esc(r.phone2 || '')}" placeholder="+998 90 123 45 67"></label>
    <label class="field"><span>Telegram</span><input class="input" id="f_telegram" maxlength="100" value="${esc(r.telegram || '')}" placeholder="@restoran"></label>
    <label class="field"><span>Instagram</span><input class="input" id="f_instagram" maxlength="100" value="${esc(r.instagram || '')}" placeholder="@restoran.uz"></label>
    <label class="field"><span>${esc(T('website'))}</span><input class="input" id="f_website" maxlength="200" value="${esc(r.website || '')}" placeholder="restoran.uz"></label>
  </div></div>

  <div class="panel"><h2>${esc(T('sec_prices'))}</h2><div class="grid3">
    <label class="field"><span>${esc(T('avg_check'))}</span><div class="pricein"><input id="f_avg" inputmode="numeric" value="${r.avg_check ? fmtN(r.avg_check) : ''}" placeholder="85 000"><span>${esc(T('som'))}</span></div><span class="hint">${esc(T('avg_check_hint'))}</span></label>
    <label class="field"><span>${esc(T('service_charge'))}, %</span><input class="input" id="f_sc" type="number" min="0" max="30" step="0.5" value="${Number(r.service_charge) || 0}"><span class="hint">${esc(T('service_hint'))}</span></label>
  </div>
  <h2 style="margin-top:22px"><span class="star"></span>${esc(T('toy_h'))}</h2>
  <div class="grid3">
    <label class="field"><span>${esc(T('banquet_capacity'))}</span><input class="input" id="f_bcap" type="number" inputmode="numeric" min="0" max="5000" step="10" value="${r.banquet_capacity || ''}" placeholder="300"></label>
    <label class="field"><span>${esc(T('banquet_price'))}</span><div class="pricein"><input id="f_bprice" inputmode="numeric" value="${r.banquet_price ? fmtN(r.banquet_price) : ''}" placeholder="250 000"><span>${esc(T('som'))}</span></div></label>
  </div>
  <p class="hint" style="margin-top:8px">${esc(T('banquet_hint'))}</p>
  </div>

  <div class="panel"><h2>${esc(T('hours'))}</h2>
    <div class="hrs" id="hrs">${[1, 2, 3, 4, 5, 6, 7].map((d) => {
      const v = hours[String(d)]; const on = Array.isArray(v) && v[0];
      const norm24 = (t) => (t === '24:00' ? '00:00' : t);
      return `<span>${esc(T('d' + d))}</span>
        <span class="switch"><input type="checkbox" data-hd="${d}" ${on ? 'checked' : ''} aria-label="${esc(T('d' + d))}"><span></span></span>
        <input class="input" type="time" data-ho="${d}" value="${esc(on ? norm24(v[0]) : '09:00')}" ${on ? '' : 'disabled'} aria-label="${esc(T('opens'))}">
        <span class="dash-sep">–</span>
        <input class="input" type="time" data-hc="${d}" value="${esc(on ? norm24(v[1]) : '22:00')}" ${on ? '' : 'disabled'} aria-label="${esc(T('closes'))}">`;
    }).join('')}</div>
    <div class="row" style="margin-top:12px"><button type="button" class="btn sm" id="hcopy">${esc(T('copy_monday'))}</button><button type="button" class="btn sm" id="h247">24/7</button><span class="hint">${esc(T('hours_hint'))}</span></div>
  </div>

  <div class="savebar"><span class="hint" id="dirtyhint"></span><span class="spacer"></span><button type="submit" class="btn primary" id="savebtn">${esc(T('save'))}</button></div>
  </form>`;

  const form = $('#inf');
  bindLangFields(form);
  const markDirty = () => { S.dirty = true; $('#dirtyhint').textContent = T('unsaved_short'); };
  form.addEventListener('input', markDirty);
  form.addEventListener('change', markDirty);
  $('#f_slug').addEventListener('input', (e) => {
    const v = e.target.value.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{2,}/g, '-');
    if (v !== e.target.value) e.target.value = v;
    $('#slugprev').textContent = v;
  });
  const toggleChip = (wrap) => wrap.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); markDirty();
  });
  toggleChip($('#f_cuis')); toggleChip($('#f_feat'));
  $('#f_city').addEventListener('change', (e) => {
    $('#f_district').innerHTML = `<option value="">—</option>${districtOptions(e.target.value, '')}`;
    $('#distwrap').hidden = !districtsOf(e.target.value).length;
    const c = cityById(e.target.value); if (c && pick.map && pick.lat == null) pick.map.setView([c.lat, c.lng], 12, { animate: false });
  });
  const priceInput = (el) => el.addEventListener('input', () => {
    const d = el.value.replace(/\D/g, '').slice(0, 9);
    el.value = d ? fmtN(Number(d)) : '';
  });
  priceInput($('#f_avg')); priceInput($('#f_bprice'));

  /* hours */
  $('#hrs').addEventListener('change', (e) => {
    const d = e.target.dataset.hd; if (!d) return;
    $(`[data-ho="${d}"]`).disabled = !e.target.checked; $(`[data-hc="${d}"]`).disabled = !e.target.checked;
  });
  $('#hcopy').onclick = () => {
    const on = $('[data-hd="1"]').checked, o = $('[data-ho="1"]').value, c = $('[data-hc="1"]').value;
    for (let d = 2; d <= 7; d++) { $(`[data-hd="${d}"]`).checked = on; $(`[data-ho="${d}"]`).value = o; $(`[data-hc="${d}"]`).value = c; $(`[data-ho="${d}"]`).disabled = !on; $(`[data-hc="${d}"]`).disabled = !on; }
    markDirty();
  };
  $('#h247').onclick = () => {
    for (let d = 1; d <= 7; d++) { $(`[data-hd="${d}"]`).checked = true; $(`[data-ho="${d}"]`).value = '00:00'; $(`[data-hc="${d}"]`).value = '00:00'; $(`[data-ho="${d}"]`).disabled = false; $(`[data-hc="${d}"]`).disabled = false; }
    markDirty();
  };

  /* map pin */
  const pick = { lat: r.lat, lng: r.lng, map: null, marker: null };
  const setPin = (lat, lng, pan) => {
    pick.lat = lat == null ? null : Math.round(lat * 1e6) / 1e6; pick.lng = lng == null ? null : Math.round(lng * 1e6) / 1e6;
    $('#pinhint').textContent = pick.lat != null ? `${pick.lat.toFixed(5)}, ${pick.lng.toFixed(5)}` : T('map_pin_hint');
    if (!pick.map) return;
    const Lf = window.L;
    if (pick.lat == null) { if (pick.marker) { pick.marker.remove(); pick.marker = null; } return; }
    if (!pick.marker) {
      pick.marker = Lf.marker([pick.lat, pick.lng], { draggable: true, icon: Lf.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(pick.map);
      pick.marker.on('dragend', () => { const p = pick.marker.getLatLng(); setPin(p.lat, p.lng); markDirty(); });
    } else pick.marker.setLatLng([pick.lat, pick.lng]);
    if (pan) pick.map.setView([pick.lat, pick.lng], Math.max(pick.map.getZoom(), 16), { animate: false });
  };
  loadLeaflet().then((Lf) => {
    const el = $('#pickmap'); if (!el || !el.isConnected) return;
    const c = cityById(r.city_id) || { lat: 39.76, lng: 67.27 };
    pick.map = Lf.map(el).setView(r.lat != null ? [r.lat, r.lng] : [c.lat, c.lng], r.lat != null ? 16 : 12);
    tileLayer(Lf).addTo(pick.map);
    S.map = pick.map;
    pick.map.on('click', (e) => { setPin(e.latlng.lat, e.latlng.lng); markDirty(); });
    if (r.lat != null) setPin(r.lat, r.lng);
  }).catch(() => { $('#pickmap').innerHTML = `<div class="empty small">${esc(T('err_map'))}</div>`; });
  $('#pinme').onclick = async (e) => {
    busy(e.currentTarget, true);
    try { const g = await getGeo(); setPin(g.lat, g.lng, true); markDirty(); } catch (er) { toast(er.message, 'err'); }
    busy(e.currentTarget, false);
  };
  $('#pinclear').onclick = () => { setPin(null, null); markDirty(); };

  /* images (saved immediately) */
  const imgUpload = async (input, field, max, prevSel) => {
    const file = input.files && input.files[0]; if (!file) return;
    const prev = $(prevSel); prev.innerHTML = '<div class="skel" style="width:100%;height:100%"></div>';
    try {
      const up = await uploadImage(r.id, file, field === 'logo_url' ? 'logo' : 'cover', max);
      const old = r[field];
      const { error } = await sb.from('restaurants').update({ [field]: up.url }).eq('id', r.id);
      if (error) { removeFiles([up.path]); throw error; }
      r[field] = up.url; removeFiles([pathFromUrl(old)]);
      prev.innerHTML = `<img src="${esc(up.url)}" alt="">`;
      toast(T('photo_saved'), 'ok'); S.cards = null;
    } catch (er) {
      fail(er);
      prev.innerHTML = r[field] ? `<img src="${esc(r[field])}" alt="">` : tileHTML(r.name);
    }
    input.value = '';
  };
  $('#f_logo').addEventListener('change', (e) => { e.stopPropagation(); imgUpload(e.target, 'logo_url', 600, '#lgprev'); });
  $('#f_cover').addEventListener('change', (e) => { e.stopPropagation(); imgUpload(e.target, 'cover_url', 1800, '#cvprev'); });
  $$('[data-rm]', form).forEach((b) => b.addEventListener('click', async () => {
    const field = b.dataset.rm; const old = r[field];
    const { error } = await sb.from('restaurants').update({ [field]: null }).eq('id', r.id);
    if (error) { fail(error); return; }
    removeFiles([pathFromUrl(old)]); r[field] = null; S.cards = null;
    const wasDirty = S.dirty; S.dirty = false; if (!wasDirty) route(true); else { toast(T('saved'), 'ok'); S.dirty = true; }
  }));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = valOf('f_name');
    if (name.length < 2) { toast(T('err_name'), 'err'); $('#f_name').focus(); return; }
    const slug = valOf('f_slug').replace(/^-+|-+$/g, '');
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug) || slug.length < 2) { toast(T('err_slug'), 'err'); $('#f_slug').focus(); return; }
    const sc = Number($('#f_sc').value);
    if (!(sc >= 0 && sc <= 30)) { toast(T('err_sc'), 'err'); return; }
    const h = {};
    for (let d = 1; d <= 7; d++) {
      if ($(`[data-hd="${d}"]`).checked) {
        const o = $(`[data-ho="${d}"]`).value, c = $(`[data-hc="${d}"]`).value;
        if (!o || !c) { toast(T('err_hours'), 'err'); return; }
        h[String(d)] = [o, c];
      }
    }
    for (const [k, fn] of [['f_telegram', tgUrl], ['f_instagram', igUrl], ['f_website', webUrl]]) {
      const v = valOf(k); if (v && !fn(v)) { toast(T('err_link'), 'err'); $('#' + k).focus(); return; }
    }
    const city = Number($('#f_city').value);
    const patch = {
      name, slug,
      tagline_uz: nul(valOf('f_tag_uz')), tagline_ru: nul(valOf('f_tag_ru')), tagline_en: nul(valOf('f_tag_en')),
      description_uz: nul(valOf('f_desc_uz')), description_ru: nul(valOf('f_desc_ru')), description_en: nul(valOf('f_desc_en')),
      cuisines: $$('#f_cuis .chip.on').map((b) => b.dataset.v),
      features: $$('#f_feat .chip.on').map((b) => b.dataset.v),
      city_id: city,
      district_id: $('#f_district').value && districtsOf(city).some((d) => d.id === Number($('#f_district').value)) ? Number($('#f_district').value) : null,
      address: nul(valOf('f_address')), landmark: nul(valOf('f_landmark')),
      lat: pick.lat, lng: pick.lng,
      phone: nul(valOf('f_phone')), phone2: nul(valOf('f_phone2')),
      telegram: nul(valOf('f_telegram')), instagram: nul(valOf('f_instagram')), website: nul(valOf('f_website')),
      avg_check: $('#f_avg').value ? Number($('#f_avg').value.replace(/\D/g, '')) : null,
      service_charge: sc,
      banquet_capacity: $('#f_bcap').value ? clamp(Math.round(Number($('#f_bcap').value)), 0, 5000) : null,
      banquet_price: $('#f_bprice').value ? Number($('#f_bprice').value.replace(/\D/g, '')) : null,
      hours: h
    };
    if (patch.lat != null && !(patch.lat >= 37 && patch.lat <= 46 && patch.lng >= 55 && patch.lng <= 74)) { toast(T('err_pin'), 'err'); return; }
    const btn = $('#savebtn'); busy(btn, true);
    const { data, error } = await sb.from('restaurants').update(patch).eq('id', r.id).select('*').single();
    busy(btn, false);
    if (error) { fail(error); return; }
    Object.assign(r, data); S.dirty = false; S.cards = null;
    $('#dirtyhint').textContent = '';
    toast(T('saved'), 'ok');
    setTitle(r.name);
  });
}

/* —— menu tab */
async function edMenu(ed, body) {
  const r = ed.r;
  const [cRes, iRes, mineRes] = await Promise.all([
    sb.from('menu_categories').select('*').eq('restaurant_id', r.id).order('sort').order('created_at'),
    sb.from('menu_items').select('*').eq('restaurant_id', r.id).order('sort').order('created_at'),
    sb.from('restaurants').select('id,name').eq('owner_id', r.owner_id || S.user.id).neq('id', r.id)
  ]);
  if (ed.tk !== S.tk) return;
  for (const x of [cRes, iRes]) if (x.error) throw x.error;
  const cats = cRes.data || [];
  const items = iRes.data || [];
  const branches = mineRes.data || [];
  let filter = '';

  const draw = () => {
    const terms = expandTerms(filter);
    const match = (it) => !terms.length || terms.some((t) => (' ' + norm([it.name_uz, it.name_ru, it.name_en].join(' '))).includes(' ' + t));
    const groups = cats.map((c) => ({ c, items: items.filter((i) => i.category_id === c.id).sort((a, b) => a.sort - b.sort) }));
    const orphan = items.filter((i) => !i.category_id || !cats.some((c) => c.id === i.category_id));
    body.innerHTML = `
      <div class="mtoolbar">
        <button class="btn primary sm" data-add-item>${svg('plus')}${esc(T('add_dish'))}</button>
        <button class="btn sm" data-add-cat>${svg('plus')}${esc(T('add_category'))}</button>
        <button class="btn sm" data-import>${svg('paste')}${esc(T('import_menu'))}</button>
        <button class="btn sm" data-bulk ${items.length ? '' : 'disabled'}>${svg('percent')}${esc(T('bulk_prices'))}</button>
        ${branches.length ? `<button class="btn sm" data-copymenu>${svg('copybranch')}${esc(T('copy_from_branch'))}</button>` : ''}
        <span class="spacer"></span>
        <label class="mtools" style="margin:0;min-width:200px;flex:0 1 260px"><span class="box2">${svg('search')}<input id="edq" type="search" placeholder="${esc(T('menu_search'))}" value="${esc(filter)}" aria-label="${esc(T('menu_search'))}"></span></label>
      </div>
      ${!items.length && !cats.length ? `<div class="panel empty"><div class="tile" style="width:84px;height:84px;border-radius:50%"></div><h3>${esc(T('menu_empty_h'))}</h3><p>${esc(T('menu_empty_p'))}</p>
        <div class="row" style="justify-content:center"><button class="btn primary" data-import>${svg('paste')}${esc(T('import_menu'))}</button><button class="btn" data-add-item>${svg('plus')}${esc(T('add_dish'))}</button></div></div>` : ''}
      ${groups.map((g, gi) => catBlock(g.c, g.items.filter(match), gi, groups.length)).join('')}
      ${orphan.length ? catBlock(null, orphan.filter(match), -1, 0) : ''}
      <p class="hint" style="margin-top:10px">${esc(T('menu_tip'))}</p>`;
    const q = $('#edq'); if (q) q.addEventListener('input', debounce(() => { filter = q.value; draw(); const nq = $('#edq'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); }, 200));
  };
  const catBlock = (c, list, gi, n) => `
    <div class="ecat" data-cat="${c ? c.id : ''}">
      <header><h3>${c ? esc(nameOf(c)) : esc(T('no_category'))} <span class="muted small">${list.length}</span></h3>
        ${c ? `<button class="btn sm ghost icon" data-cup="${c.id}" ${gi === 0 || filter ? 'disabled' : ''} aria-label="${esc(T('move_up'))}">${svg('up')}</button>
        <button class="btn sm ghost icon" data-cdown="${c.id}" ${gi === n - 1 || filter ? 'disabled' : ''} aria-label="${esc(T('move_down'))}">${svg('down')}</button>
        <button class="btn sm ghost icon" data-cedit="${c.id}" aria-label="${esc(T('edit'))}">${svg('edit')}</button>
        <button class="btn sm ghost icon danger" data-cdel="${c.id}" aria-label="${esc(T('delete'))}">${svg('trash')}</button>` : ''}
        <button class="btn sm" data-add-item="${c ? c.id : 'none'}">${svg('plus')}${esc(T('dish'))}</button>
      </header>
      ${list.map((it, i) => `<div class="eitem ${it.is_available ? '' : 'off'}" data-id="${it.id}">
        <div class="thumb">${it.photo_url ? `<img src="${esc(it.photo_url)}" alt="" loading="lazy">` : tileHTML(nameOf(it))}</div>
        <div style="min-width:0"><div class="nm">${esc(nameOf(it))}</div><div class="sub">${[it.portion, ...(it.tags || []).map((t) => T('tag_' + t))].filter(Boolean).map(esc).join(' · ')}${missingLangs(it)}</div></div>
        <div class="pricein" style="width:140px"><input inputmode="numeric" data-price="${it.id}" value="${fmtN(it.price)}" aria-label="${esc(T('price'))}"><span>${esc(T('som'))}</span></div>
        <div class="ops">
          <label class="switch" title="${esc(T('available'))}"><input type="checkbox" data-avail="${it.id}" ${it.is_available ? 'checked' : ''} aria-label="${esc(T('available'))}"><span></span></label>
          <button class="btn sm ghost icon" data-iup="${it.id}" ${i === 0 || filter ? 'disabled' : ''} aria-label="${esc(T('move_up'))}">${svg('up')}</button>
          <button class="btn sm ghost icon" data-idown="${it.id}" ${i === list.length - 1 || filter ? 'disabled' : ''} aria-label="${esc(T('move_down'))}">${svg('down')}</button>
          <button class="btn sm ghost icon" data-iedit="${it.id}" aria-label="${esc(T('edit'))}">${svg('edit')}</button>

  };
  const reload = async () => {
    const [c2, i2] = await Promise.all([
      sb.from('menu_categories').select('*').eq('restaurant_id', r.id).order('sort').order('created_at'),
      sb.from('menu_items').select('*').eq('restaurant_id', r.id).order('sort').order('created_at')
    ]);

    cats.splice(0, cats.length, ...(c2.data || [])); items.splice(0, items.length, ...(i2.data || []));
    S.cards = null; draw();
  };
  const swap = async (kind, arr, id, dir) => {
    const i = arr.findIndex((x) => x.id === id); const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    arr.forEach((x, k) => { x.sort = k + 1; });
    draw();
    const { error } = await sb.rpc('reorder_menu', { p_kind: kind, p_ids: arr.map((x) => x.id) });
    if (error) { fail(error); reload(); }
  };

  body.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b || !body.contains(b)) return;

    if (d.addItem !== undefined) return itemModal(r, cats, null, d.addItem === 'none' ? null : (d.addItem || (cats[0] && cats[0].id) || null), reload);
    if (d.addCat !== undefined) return categoryModal(r, null, cats, reload);

    if (d.bulk !== undefined) return bulkModal(r, cats, items, reload);
    if (d.copymenu !== undefined) return copyMenuModal(r, branches, reload);
    if (d.cedit) return categoryModal(r, cats.find((c) => c.id === d.cedit), cats, reload);
    if (d.cup) return swap('categories', cats, d.cup, -1);
    if (d.cdown) return swap('categories', cats, d.cdown, 1);
    if (d.cdel) {
      const c = cats.find((x) => x.id === d.cdel);
      const n = items.filter((i) => i.category_id === c.id).length;
      if (!(await confirmBox(n ? T('del_cat_items', { n }) : T('del_cat'), { ok: T('delete'), danger: true }))) return;
      const { error } = await sb.from('menu_categories').delete().eq('id', c.id);
      if (error) { fail(error); return; }
      toast(T('deleted'), 'ok'); return reload();
    }
    const catOf = (x) => (cats.some((c) => c.id === x.category_id) ? x.category_id : null);
    const itemList = (id) => { const it = items.find((x) => x.id === id); const k = catOf(it); return items.filter((x) => catOf(x) === k).sort((a, b) => a.sort - b.sort); };
    if (d.iup) return swap('items', itemList(d.iup), d.iup, -1);
    if (d.idown) return swap('items', itemList(d.idown), d.idown, 1);
    if (d.iedit) return itemModal(r, cats, items.find((x) => x.id === d.iedit), null, reload);
    if (d.idel) {
      const it = items.find((x) => x.id === d.idel);
      if (!(await confirmBox(T('del_item', { n: nameOf(it) }), { ok: T('delete'), danger: true }))) return;
      const { error } = await sb.from('menu_items').delete().eq('id', it.id);
      if (error) { fail(error); return; }
      removeDishPhoto(it.photo_path, it.photo_url, it.id); toast(T('deleted'), 'ok'); return reload();
    }
  });
  body.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.dataset.avail) {
      const it = items.find((x) => x.id === t.dataset.avail);
      const { error } = await sb.from('menu_items').update({ is_available: t.checked }).eq('id', it.id);
      if (error) { fail(error); t.checked = !t.checked; return; }
      it.is_available = t.checked; t.closest('.eitem').classList.toggle('off', !t.checked);
      toast(t.checked ? T('back_on_menu') : T('stoplist_added'), 'ok'); S.cards = null;
    }
    if (t.dataset.price) savePrice(t);
  });
  body.addEventListener('input', (e) => {
    const t = e.target; if (!t.dataset.price) return;
    const dgt = t.value.replace(/\D/g, '').slice(0, 9); t.value = dgt ? fmtN(Number(dgt)) : '';
  });
  body.addEventListener('keydown', (e) => { if (e.target.dataset && e.target.dataset.price && e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  async function savePrice(t) {
    const it = items.find((x) => x.id === t.dataset.price); if (!it) return;
    const v = Number(t.value.replace(/\D/g, ''));
    if (!t.value.trim() || !(v >= 0)) { t.value = fmtN(it.price); return; }

    if (error) { fail(error); t.value = fmtN(it.price); return; }
    toast(T('price_saved', { a: money(it.price), b: money(v) }), 'ok');
    it.price = v; S.cards = null;
  }
  draw();
}

/* paste-to-import parser */
function parseMenuText(text, thousands) {
  const out = []; const skipped = [];
  let cat = null;
  const unitMap = { g: 'g', gr: 'g', 'гр': 'g', 'г': 'g', kg: 'kg', 'кг': 'kg', ml: 'ml', 'мл': 'ml', l: 'l', 'л': 'l', dona: 'dona', ta: 'dona', 'шт': 'шт', pcs: 'pcs' };
  for (const raw of String(text || '').split(/\r?\n/)) {
    let s = raw.replace(/\t/g, ' ').trim();
    if (!s) continue;
    s = s.replace(/^(\d{1,2}[.)]|[-–—•*·▪►])\s+/, '');
    if (/^#+\s*/.test(s) || /:\s*$/.test(s)) { cat = s.replace(/^#+\s*/, '').replace(/:\s*$/, '').trim(); continue; }
    let portion = null;
    const pm = s.match(/[([]?\s*(\d+(?:[.,]\d+)?)\s*(kg|кг|gr|гр|g|г|ml|мл|l|л|dona|ta|шт|pcs)\.?\s*[)\]]?(?=[\s,.;:–—-]|$)/i);
    const priceRe = /(\d{1,3}(?:[  .,'’]\d{3})+|\d+(?:[.,]\d{1,2})?)(?:[.,]00)?\s*(k|к|ming|тыс\.?|т\.?)?\s*(?:so['ʻʼ’‘`]?m|sum|сум|сўм|uzs)?\.?\s*$/i;
    let work = s;
    if (pm) {
      portion = `${pm[1].replace(',', '.')} ${unitMap[pm[2].toLowerCase()] || pm[2].toLowerCase()}`;
      work = (s.slice(0, pm.index) + ' ' + s.slice(pm.index + pm[0].length)).replace(/\s{2,}/g, ' ').trim();
    }
    const m = work.match(priceRe);
    if (!m) {
      if (/\d/.test(work)) { skipped.push(raw.trim()); continue; }
      cat = work.trim(); continue;
    }
    let num;
    if (/^\d{1,3}([  .,'’]\d{3})+$/.test(m[1])) num = Number(m[1].replace(/[^\d]/g, ''));
    else num = parseFloat(m[1].replace(',', '.'));
    if (m[2]) num *= 1000;
    let name = work.slice(0, m.index).replace(/[\s.\-–—:|…_=]+$/, '').replace(/^[\s.\-–—:|…_]+/, '').trim();
    if (!name) { skipped.push(raw.trim()); continue; }
    if (!(num > 0)) { skipped.push(raw.trim()); continue; }
    out.push({ cat, name: name.slice(0, 100), price: num, portion, small: !m[2] && num < 1000 });
  }
  if (thousands) for (const o of out) if (o.small) o.price = o.price * 1000;
  for (const o of out) o.price = Math.round(o.price);
  return { items: out, skipped };
}

/* —— photos tab */
async function edPhotos(ed, body) {
  const r = ed.r;
  let photos = [];
  const load = async () => {
    const { data, error } = await sb.from('restaurant_photos').select('*').eq('restaurant_id', r.id).order('sort').order('created_at');
    if (error) throw error;
    photos = data || [];
  };
  await load();
  if (ed.tk !== S.tk) return;
  const draw = () => {
    body.innerHTML = `<div class="panel"><h2>${esc(T('gallery'))} <span class="muted small">${photos.length}/30</span></h2>
      <label class="dropzone" id="dz">${svg('upload')}<b>${esc(T('drop_photos'))}</b><span class="hint">${esc(T('drop_hint'))}</span><input type="file" id="ph_in" accept="image/*" multiple hidden></label>
      <div id="ph_prog"></div>
      <div class="photos" style="margin-top:16px">${photos.map((p, i) => `<figure><img src="${esc(p.url)}" alt="" loading="lazy"><figcaption>
        <button class="btn sm ghost icon" data-pl="${p.id}" ${i === 0 ? 'disabled' : ''} aria-label="${esc(T('move_up'))}">${svg('left')}</button>
        <button class="btn sm ghost icon" data-pr="${p.id}" ${i === photos.length - 1 ? 'disabled' : ''} aria-label="${esc(T('move_down'))}">${svg('right')}</button>
        <span class="spacer"></span><button class="btn sm ghost icon danger" data-pd="${p.id}" aria-label="${esc(T('delete'))}">${svg('trash')}</button></figcaption></figure>`).join('')}</div></div>`;
    const dz = $('#dz'), inp = $('#ph_in');
    inp.addEventListener('change', () => upload(Array.from(inp.files || [])));
    ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', (e) => upload(Array.from((e.dataTransfer && e.dataTransfer.files) || [])));
  };
  const upload = async (files) => {
    files = files.filter((f) => /^image\//.test(f.type)).slice(0, Math.max(0, 30 - photos.length));
    if (!files.length) { toast(T('err_img_type'), 'err'); return; }
    let n = 0; let sort = photos.reduce((s, p) => Math.max(s, p.sort || 0), 0);
    for (const f of files) {
      $('#ph_prog').innerHTML = `<p class="hint" style="margin-top:10px"><span class="spinner"></span> ${esc(T('uploading', { a: n + 1, b: files.length }))}</p>`;
      try {
        const up = await uploadImage(r.id, f, 'gallery', 1600);
        const { error } = await sb.from('restaurant_photos').insert({ restaurant_id: r.id, url: up.url, path: up.path, sort: ++sort });
        if (error) { removeFiles([up.path]); throw error; }
        n++;
      } catch (er) { fail(er); }
    }
    toast(T('uploaded_n', { n }), 'ok');
    await load(); draw();
  };
  body.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.pd) {
      const p = photos.find((x) => x.id === d.pd);
      if (!(await confirmBox(T('del_photo'), { ok: T('delete'), danger: true }))) return;
      const { error } = await sb.from('restaurant_photos').delete().eq('id', p.id);
      if (error) { fail(error); return; }
      removeFiles([p.path]); photos = photos.filter((x) => x !== p); draw(); return;
    }
    const move = d.pl || d.pr; if (!move) return;
    const i = photos.findIndex((x) => x.id === move); const j = i + (d.pl ? -1 : 1);
    if (j < 0 || j >= photos.length) return;
    [photos[i], photos[j]] = [photos[j], photos[i]]; draw();
    const { error } = await sb.rpc('reorder_menu', { p_kind: 'photos', p_ids: photos.map((x) => x.id) });
    if (error) fail(error);
  });
  draw();
}

/* —— QR tab: printable table card */
async function edQr(ed, body) {
  const r = ed.r;
  const url = pageUrl(r.id, 'qr');
  body.innerHTML = `<div class="panel"><div class="qrwrap">
    <canvas id="qrc" width="1200" height="1600" aria-label="${esc(T('qr_card'))}"></canvas>
    <div class="stack">
      <h2 style="margin:0">${esc(T('qr_h'))}</h2>
      <p class="muted">${esc(T('qr_p'))}</p>
      <div class="linkbox"><code>${esc(url)}</code><button class="btn sm" id="qrcopy">${svg('copy')}${esc(T('copy'))}</button></div>
      <label class="field"><span>${esc(T('table_no'))}</span><input class="input" id="qrtable" maxlength="6" placeholder="12" style="max-width:140px"></label>
      <div class="row"><button class="btn primary" id="qrdl">${svg('download')}${esc(T('download_card'))}</button><button class="btn" id="qrdl2">${svg('qr')}${esc(T('download_qr'))}</button></div>
      <p class="hint">${esc(T('qr_hint'))}</p>
      ${r.status !== 'published' ? `<div class="notice warn">${esc(T('qr_unpublished'))}</div>` : ''}
    </div></div></div>`;
  $('#qrcopy').onclick = () => copyText(url);
  try { await loadScript(CFG.qrJs); } catch { $('#qrc').replaceWith(Object.assign(document.createElement('p'), { className: 'notice err', textContent: T('err_net') })); return; }
  if (ed.tk !== S.tk) return;
  const qr = window.qrcode(0, 'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount();
  try { await document.fonts.ready; } catch { /* ignore */ }
  const drawQr = (ctx, x, y, size) => {
    const cell = size / n;
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - cell * 2, y - cell * 2, size + cell * 4, size + cell * 4);
    ctx.fillStyle = '#111C33';
    for (let rr = 0; rr < n; rr++) for (let cc = 0; cc < n; cc++) if (qr.isDark(rr, cc)) ctx.fillRect(Math.floor(x + cc * cell), Math.floor(y + rr * cell), Math.ceil(cell), Math.ceil(cell));
  };
  const fitText = (ctx, text, maxW, size, weight, family) => {
    for (let s = size; s >= 20; s -= 2) { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(text).width <= maxW) break; }
  };
  const draw = () => {
    const c = $('#qrc'); if (!c) return;
    const ctx = c.getContext('2d'); const W = c.width, H = c.height;
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    /* ikat band */
    const band = (y) => {
      ctx.fillStyle = '#1E3870'; ctx.fillRect(0, y, W, 56);
      ctx.strokeStyle = '#D2B26C'; ctx.lineWidth = 3;
      for (let x = 32; x < W; x += 64) {
        ctx.save(); ctx.translate(x, y + 28);
        ctx.strokeRect(-12, -12, 24, 24); ctx.rotate(Math.PI / 4); ctx.strokeRect(-12, -12, 24, 24);
        ctx.restore();
        ctx.beginPath(); ctx.moveTo(x + 17, y + 28); ctx.lineTo(x + 47, y + 28); ctx.stroke();
      }
    };
    band(0); band(H - 56);
    ctx.textAlign = 'center'; ctx.fillStyle = '#1B2132';
    fitText(ctx, r.name, W - 160, 92, 700, "'Alegreya', Georgia, serif");
    ctx.fillText(r.name, W / 2, 190);
    ctx.font = "italic 400 42px 'Alegreya', Georgia, serif"; ctx.fillStyle = '#5F6372';
    ctx.fillText("Menyu va narxlar · Меню и цены · Menu", W / 2, 260);
    drawQr(ctx, (W - 800) / 2, 330, 800);
    ctx.fillStyle = '#1B2132'; ctx.font = "500 46px 'Alegreya Sans', sans-serif";
    ctx.fillText('Skanerlang · Отсканируйте · Scan', W / 2, 1270);
    const tbl = ($('#qrtable') || {}).value || '';
    if (tbl.trim()) {
      ctx.fillStyle = '#1E3870'; const tw = 360; ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect((W - tw) / 2, 1320, tw, 110, 10); else ctx.rect((W - tw) / 2, 1320, tw, 110);
      ctx.fill(); ctx.strokeStyle = '#D2B26C'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#F6F1E6'; ctx.font = "700 60px 'Alegreya', Georgia, serif";
      ctx.fillText(`№ ${tbl.trim()}`, W / 2, 1395);
    }
    ctx.fillStyle = '#9F7A34'; ctx.font = "700 34px 'Alegreya', Georgia, serif";
    ctx.fillText('Dasturxon', W / 2, H - 84);
  };
  draw();
  $('#qrtable').addEventListener('input', draw);
  const save = (canvas, name) => canvas.toBlob((b) => {
    if (!b) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }, 'image/png');
  $('#qrdl').onclick = () => save($('#qrc'), `${r.slug}-qr-card${$('#qrtable').value.trim() ? '-' + $('#qrtable').value.trim() : ''}.png`);
  $('#qrdl2').onclick = () => {
    const c = document.createElement('canvas'); c.width = c.height = 1000;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, 1000, 1000); drawQr(ctx, 60, 60, 880);
    save(c, `${r.slug}-qr.png`);
  };
}

/* —— stats tab */
async function edStats(ed, body) {
  const r = ed.r;
  const days = 30;
  const start = new Date(Date.now() - (days - 1) * 86400000);
  const startStr = new Intl.DateTimeFormat('en-CA', { timeZone: CFG.tz }).format(start);
  const [sRes, hRes, iRes] = await Promise.all([
    sb.from('daily_stats').select('day,views,qr_scans').eq('restaurant_id', r.id).gte('day', startStr).order('day'),
    sb.from('menu_price_history').select('item_id,old_price,new_price,changed_at').eq('restaurant_id', r.id).order('changed_at', { ascending: false }).limit(30),
    sb.from('menu_items').select('id,name_uz,name_ru,name_en').eq('restaurant_id', r.id)
  ]);
  if (ed.tk !== S.tk) return;
  for (const x of [sRes, hRes, iRes]) if (x.error) throw x.error;
  const byDay = new Map((sRes.data || []).map((x) => [x.day, x]));
  const series = [];
  for (let i = 0; i < days; i++) {
    const d = new Intl.DateTimeFormat('en-CA', { timeZone: CFG.tz }).format(new Date(start.getTime() + i * 86400000));
    const x = byDay.get(d) || { views: 0, qr_scans: 0 };
    series.push({ d, v: x.views, q: x.qr_scans });
  }
  const tv = series.reduce((s, x) => s + x.v, 0), tq = series.reduce((s, x) => s + x.q, 0);
  const last7 = series.slice(-7).reduce((s, x) => s + x.v, 0);
  const max = Math.max(4, ...series.map((x) => x.v));
  const nice = (m) => { const p = Math.pow(10, Math.floor(Math.log10(m))); const k = m / p; return (k <= 1 ? 1 : k <= 2 ? 2 : k <= 5 ? 5 : 10) * p; };
  const top = nice(max);
  const W = 720, H = 220, padL = 34, padB = 24, padT = 10, cw = (W - padL - 6) / days, ch = H - padB - padT;
  const ticks = [0, top / 2, top];
  const itemName = new Map((iRes.data || []).map((i) => [i.id, nameOf(i)]));
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('views_30d'))}">
    ${ticks.map((t) => { const y = padT + ch - (t / top) * ch; return `<line class="grid" x1="${padL}" x2="${W - 4}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${fmtN(t)}</text>`; }).join('')}
    ${series.map((x, i) => { const hV = (x.v / top) * ch, hQ = (x.q / top) * ch; const xx = padL + i * cw + cw * 0.15; const w = cw * 0.7;
      return `<rect class="v" x="${xx.toFixed(1)}" y="${(padT + ch - hV).toFixed(1)}" width="${w.toFixed(1)}" height="${hV.toFixed(1)}" rx="2"><title>${x.d}: ${x.v} / QR ${x.q}</title></rect>${x.q ? `<rect class="q" x="${xx.toFixed(1)}" y="${(padT + ch - hQ).toFixed(1)}" width="${w.toFixed(1)}" height="${hQ.toFixed(1)}" rx="2"/>` : ''}`; }).join('')}
    ${[0, 10, 20, 29].map((i) => `<text x="${(padL + i * cw + cw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${series[i].d.slice(8, 10)}.${series[i].d.slice(5, 7)}</text>`).join('')}
  </svg>`;
  body.innerHTML = `
    <div class="stats3" style="margin-top:0">
      <div class="stat"><span class="label">${esc(T('views_30d'))}</span><b>${fmtN(tv)}</b></div>
      <div class="stat"><span class="label">${esc(T('views_7d'))}</span><b>${fmtN(last7)}</b></div>
      <div class="stat"><span class="label">${esc(T('qr_30d'))}</span><b>${fmtN(tq)}</b></div>
    </div>
    <div class="panel"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">${esc(T('views_by_day'))}</h2><span class="spacer"></span>
      <div class="legend"><span><i style="background:var(--cobalt)"></i>${esc(T('views'))}</span><span><i style="background:var(--saffron)"></i>${esc(T('qr_scans'))}</span></div></div>
      ${tv ? chart : `<p class="hint">${esc(T('no_views_yet'))}</p>`}
      <p class="hint" style="margin-top:8px">${esc(T('stats_hint'))}</p></div>
    <div class="panel"><h2>${esc(T('price_log'))}</h2>
      ${(hRes.data || []).length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(T('dish'))}</th><th class="n">${esc(T('was'))}</th><th class="n">${esc(T('now'))}</th><th class="n">${esc(T('when'))}</th></tr></thead><tbody>
        ${hRes.data.map((h) => `<tr><td>${esc(itemName.get(h.item_id) || '—')}</td><td class="n">${money(h.old_price)}</td><td class="n ${h.new_price > h.old_price ? 'up' : 'down'}">${money(h.new_price)}</td><td class="n muted">${esc(ago(h.changed_at))}</td></tr>`).join('')}
      </tbody></table></div>` : `<p class="hint">${esc(T('no_price_changes'))}</p>`}</div>`;
}

/* ───────────────────────── ADMIN ───────────────────────── */
function moderateModal(r, done) {
  const m = openModal({
    title: T('moderate') + ': ' + r.name,
    body: `<label class="field"><span>${esc(T('status'))}</span><select class="input" id="m_st">${['draft', 'pending', 'published', 'hidden', 'rejected'].map((s) => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${esc(T('st_' + s))}</option>`).join('')}</select></label>
      <label class="row"><span class="switch"><input type="checkbox" id="m_ver" ${r.is_verified ? 'checked' : ''}><span></span></span>${esc(T('verified'))}</label>
      <label class="row"><span class="switch"><input type="checkbox" id="m_demo" ${r.is_demo ? 'checked' : ''}><span></span></span>${esc(T('demo_long'))}</label>
      <label class="field"><span>${esc(T('admin_note'))}</span><textarea class="input" id="m_note" maxlength="500" rows="3">${esc(r.admin_note || '')}</textarea><span class="hint">${esc(T('admin_note_hint'))}</span></label>`,
    foot: `<button class="btn" data-c>${esc(T('cancel'))}</button><button class="btn primary" data-ok>${esc(T('save'))}</button>`
  });
  $('[data-c]', m.el).onclick = () => m.close();
  $('[data-ok]', m.el).onclick = async (e) => {
    busy(e.currentTarget, true);
    const { error } = await sb.from('restaurants').update({ status: $('#m_st', m.el).value, is_verified: $('#m_ver', m.el).checked, is_demo: $('#m_demo', m.el).checked, admin_note: nul($('#m_note', m.el).value.trim()) }).eq('id', r.id);
    busy(e.currentTarget, false);
    if (error) { fail(error); return; }
    m.close(); toast(T('saved'), 'ok'); S.cards = null; done();
  };
}
async function viewAdmin(q) {
  const tk = ++S.tk;
  if (!requireAuth()) return;
  if (!isAdmin()) { app.innerHTML = `<div class="wrap empty"><p>${esc(T('err_perm'))}</p></div>`; return; }
  setTitle(T('nav_admin'));
  app.innerHTML = loadingHTML();
  const { data, error } = await sb.from('restaurant_cards').select('*').order('updated_at', { ascending: false }).limit(3000);
  if (tk !== S.tk) return;
  if (error) throw error;
  const all = data || [];
  const ownerIds = [...new Set(all.map((r) => r.owner_id).filter(Boolean))];
  const owners = new Map();
  for (let i = 0; i < ownerIds.length; i += 150) {
    const { data: ps } = await sb.from('profiles').select('id,email,full_name,phone').in('id', ownerIds.slice(i, i + 150));
    (ps || []).forEach((p) => owners.set(p.id, p));
  }
  if (tk !== S.tk) return;
  let tab = q.s || 'pending'; let search = '';
  const counts = { pending: 0, published: 0, draft: 0, hidden: 0, rejected: 0, demo: 0 };
  all.forEach((r) => { counts[r.status] = (counts[r.status] || 0) + 1; if (r.is_demo) counts.demo++; });
  const draw = () => {
    const terms = norm(search).split(' ').filter(Boolean);
    const list = all.filter((r) => (tab === 'all' || (tab === 'demo' ? r.is_demo : r.status === tab)))
      .filter((r) => { if (!terms.length) return true; const o = owners.get(r.owner_id) || {}; const hay = norm([r.name, o.email, o.full_name, o.phone, r.slug].join(' ')); return terms.every((t) => hay.includes(t)); });
    app.innerHTML = `<section class="wrap dash">
      <div class="row"><h1>${esc(T('nav_admin'))}</h1><span class="spacer"></span>${counts.demo ? `<button class="btn sm danger" id="deldemo">${svg('trash')}${esc(T('delete_demo', { n: counts.demo }))}</button>` : ''}</div>
      <div class="stats3" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div class="stat"><span class="label">${esc(T('st_published'))}</span><b>${counts.published}</b></div>
        <div class="stat"><span class="label">${esc(T('st_pending'))}</span><b>${counts.pending}</b></div>
        <div class="stat"><span class="label">${esc(T('st_draft'))}</span><b>${counts.draft}</b></div>
        <div class="stat"><span class="label">${esc(T('owners_n'))}</span><b>${ownerIds.length}</b></div>
      </div>
      <div class="row" style="margin-bottom:12px">
        <div class="seg">${['pending', 'published', 'draft', 'hidden', 'rejected', 'demo', 'all'].map((s) => `<button data-tab="${s}" class="${s === tab ? 'on' : ''}">${esc(s === 'all' ? T('all') : s === 'demo' ? T('demo') : T('st_' + s))} <span class="muted">${s === 'all' ? all.length : counts[s] || 0}</span></button>`).join('')}</div>
        <span class="spacer"></span>
        <label class="mtools" style="margin:0;flex:0 1 280px"><span class="box2">${svg('search')}<input id="adq" type="search" value="${esc(search)}" placeholder="${esc(T('admin_search'))}" aria-label="${esc(T('admin_search'))}"></span></label>
      </div>
      ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(T('r_name'))}</th><th>${esc(T('owner'))}</th><th class="n">${esc(T('dishes'))}</th><th>${esc(T('status'))}</th><th class="n">${esc(T('updated'))}</th><th></th></tr></thead><tbody>
        ${list.map((r) => { const o = owners.get(r.owner_id) || {}; return `<tr>
          <td><a href="#/dash/${r.id}"><b>${esc(r.name)}</b></a>${r.is_verified ? verifiedHTML() : ''}<div class="small muted">${esc(placeOf(r))}${r.is_demo ? ' · ' + esc(T('demo')) : ''}</div></td>
          <td class="small">${esc(o.full_name || '—')}<div class="muted">${esc(o.email || '')}${o.phone ? ' · ' + esc(o.phone) : ''}</div></td>
          <td class="n">${r.dish_count || 0}</td>
          <td>${statusPillHTML(r.status)}</td>
          <td class="n small muted">${esc(ago(r.updated_at))}</td>
          <td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end">
            <a class="btn sm ghost icon" href="#/r/${encodeURIComponent(r.slug)}" target="_blank" rel="noopener" aria-label="${esc(T('preview'))}">${svg('eye')}</a>
            ${r.status !== 'published' ? `<button class="btn sm primary" data-pub="${r.id}">${esc(T('publish'))}</button>` : ''}
            <button class="btn sm" data-mod="${r.id}">${esc(T('moderate'))}</button></div></td>
        </tr>`; }).join('')}
      </tbody></table></div>` : `<div class="empty"><p>${esc(T('nothing_found'))}</p></div>`}
    </section>`;
    $$('[data-tab]').forEach((b) => b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, '', '#/admin?s=' + tab); S.lastHash = location.hash; draw(); });
    const qi = $('#adq'); qi.addEventListener('input', debounce(() => { search = qi.value; draw(); const n = $('#adq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250));
    $$('[data-pub]').forEach((b) => b.onclick = async () => {
      busy(b, true);
      const { error: er } = await sb.from('restaurants').update({ status: 'published', admin_note: null }).eq('id', b.dataset.pub);
      if (er) { busy(b, false); fail(er); return; }
      const r = all.find((x) => x.id === b.dataset.pub); counts[r.status]--; r.status = 'published'; counts.published++;
      toast(T('published_toast', { n: r.name }), 'ok'); S.cards = null; draw();
    });
    $$('[data-mod]').forEach((b) => b.onclick = () => moderateModal(all.find((x) => x.id === b.dataset.mod), () => route(true)));
    const dd = $('#deldemo');
    if (dd) dd.onclick = async () => {
      if (!(await confirmBox(T('delete_demo_text', { n: counts.demo }), { ok: T('delete'), danger: true }))) return;
      const { error: er } = await sb.from('restaurants').delete().eq('is_demo', true);
      if (er) { fail(er); return; }
      toast(T('deleted'), 'ok'); S.cards = null; route(true);
    };
  };
  draw();
}

/* ───────────────────────── boot ───────────────────────── */
async function boot() {
  const initialHash = location.hash;
  renderTop();
  app.innerHTML = loadingHTML();
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(async () => {
      const prev = S.user && S.user.id;
      S.user = session ? session.user : null;
      if (event === 'PASSWORD_RECOVERY') { await loadProfile(); renderTop(); go('#/reset'); return; }
      if ((S.user && S.user.id) !== prev) {
        await loadProfile(); renderTop();
        if (event === 'SIGNED_OUT') { const p0 = parseHash().parts[0]; if (p0 === 'dash' || p0 === 'admin') go('#/'); }
      }
    }, 0);
  });
  try {
    const { data } = await sb.auth.getSession();
    S.user = data.session ? data.session.user : null;
    await Promise.all([loadLookups(), loadProfile()]);
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="wrap empty">${tileHTML('!')}<p>${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">${esc(T('retry'))}</button></div>`;
    return;
  }
  if (/error_description=/.test(initialHash)) {
    const p = new URLSearchParams(initialHash.replace(/^#/, ''));
    toast(p.get('error_description') || T('err_generic'), 'err');
    history.replaceState(null, '', location.pathname + '#/login');
  } else if (/access_token=|type=recovery|type=signup/.test(initialHash)) {
    const isRecovery = /type=recovery/.test(initialHash);
    history.replaceState(null, '', location.pathname + (isRecovery ? '#/reset' : (S.user ? '#/dash' : '#/login')));
    if (!isRecovery && S.user) toast(T('email_confirmed'), 'ok');
  } else if (/^#[^/]/.test(location.hash) && !/^#\//.test(location.hash)) {
    history.replaceState(null, '', location.pathname + '#/');
  }
  S.lastHash = location.hash;
  route();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const reg = () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('offline mode unavailable', e));
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
  window.addEventListener('offline', () => toast(T('offline_note')));
  window.addEventListener('online', () => toast(T('back_online'), 'ok'));
}
boot();
})();

</script>
